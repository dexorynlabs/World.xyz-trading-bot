[package]
name = "world-xyz-bot"
version = "0.1.0"
edition = "2021"
description = "Latency-first trading bot template for World (world.xyz) Solana prediction markets"
license = "MIT"

[[bin]]
name = "world-xyz-bot"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
futures = "0.3"
# Solana signing without the heavy solana-sdk: ed25519 + wire-format patching.
ed25519-dalek = "2"
bs58 = "0.5"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
